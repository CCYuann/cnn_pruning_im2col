<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CNN 研究討論室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8fa;color:#243046;font:16px/1.7 system-ui,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #d8dfeb;border-radius:10px;padding:9px 14px;background:white;color:#334155}button:disabled{opacity:.5;cursor:wait}main{display:grid;grid-template-columns:290px 1fr;max-width:1400px;margin:auto;height:100dvh}aside{padding:28px 22px;border-right:1px solid #e1e6ef;background:white;overflow:auto}h1{font-size:22px;line-height:1.4;margin:0}small,.muted{color:#718096;font-size:13px}label{display:block;margin:22px 0 7px;font-size:14px}input{width:100%;padding:10px;border:1px solid #ccd5e2;border-radius:8px}summary{cursor:pointer;font-size:14px;margin-top:25px}#files{font-size:12px;overflow-wrap:anywhere;color:#69778d;padding-left:18px}.workspace{display:flex;flex-direction:column;min-height:0}header{padding:20px 32px;background:#ffffffd9;border-bottom:1px solid #e1e6ef;display:flex;justify-content:space-between;align-items:center}#chat{flex:1;overflow:auto;padding:30px max(24px,calc((100% - 850px)/2))}.welcome{padding:30px 0}.welcome h2{font-size:28px;line-height:1.4}.suggestion{display:block;text-align:left;width:100%;margin:12px 0;padding:14px 18px}.message{margin:0 0 24px}.who{font-size:13px;font-weight:700;margin-bottom:8px;color:#64748b}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:white;border:1px solid #e0e6ef;border-radius:14px;padding:18px 22px}.user .bubble{background:#eaf0fb;border-color:#dce5f6}.copy{font-size:12px;margin-top:7px;padding:3px 10px}footer{padding:16px 28px 22px;background:#f7f8fa}form{display:flex;gap:12px;max-width:850px;margin:auto;background:white;padding:12px;border:1px solid #cfd8e7;border-radius:16px;box-shadow:0 6px 24px #24304609}textarea{resize:vertical;min-height:62px;max-height:240px;border:0;outline:0;flex:1;padding:8px;min-width:0}#send{background:#325b9f;color:white;align-self:flex-end;border:0}#status{max-width:850px;margin:8px auto 0;font-size:13px;color:#64748b}.error{color:#ae3030!important}@media(max-width:760px){main{grid-template-columns:1fr;height:auto;min-height:100dvh}aside{border-right:0;padding:18px}aside details{display:none}label{margin-top:10px}.workspace{height:80dvh}header{padding:16px}#chat{padding:18px}footer{padding:12px}}
</style>
<main><aside><h1>CNN 研究討論室</h1><small>Cross-filter pruning · Research companion</small><label for="key">MYAI168 API Key</label><input id="key" type="password" autocomplete="off" placeholder="貼上平台金鑰"><small>僅存於此頁記憶體，重新整理後需再輸入。</small><p class="muted">Claude Fable 5.1<br>海大 MYAI168 平台<br>你輸入的問題與本次對話會送至平台，依用量扣點。</p><button id="reset">開啟新對話</button> <button id="export">匯出對話</button><p class="muted">參考資料：Cross-Filter 論文全文文字＋目前軟體架構簡介。只討論軟體創新，維持共享 mask 結構；未加入舊實驗結果。論文圖表影像不包含在文字擷取中。</p><p class="muted">對話保存在此瀏覽器。可隨時清除；模型建議仍需實驗驗證。</p></aside>
<section class="workspace"><header><strong>一起找出下一個研究方向</strong><small>支援連續追問</small></header><div id="chat" aria-live="polite"></div><footer><form id="form"><textarea id="question" aria-label="研究問題" placeholder="說說你的想法，也可以貼上結果一起討論…"></textarea><button id="send">傳送 ↑</button></form><div id="status" role="status">Enter 傳送 · Shift+Enter 換行</div></footer></section></main>
<script>
const $=id=>document.getElementById(id);let messages=[],busy=false;
try{const saved=JSON.parse(localStorage.getItem('cnn-research-ideas-v2')||'[]');if(Array.isArray(saved))messages=saved.filter(m=>['user','assistant'].includes(m.role)&&typeof m.content==='string')}catch{}
function persist(){try{localStorage.setItem('cnn-research-ideas-v2',JSON.stringify(messages))}catch{status('瀏覽器無法儲存對話，請使用匯出功能。',true)}}
function status(s,error=false){$('status').textContent=s;$('status').className=error?'error':''}
function bubble(role,text){const item=document.createElement('article');item.className='message '+role;const who=document.createElement('div');who.className='who';who.textContent=role==='user'?'你':'Claude';const content=document.createElement('div');content.className='bubble';content.textContent=text;item.append(who,content);if(role==='assistant'){const copy=document.createElement('button');copy.textContent='複製';copy.className='copy';copy.onclick=async()=>{try{await navigator.clipboard.writeText(content.textContent);copy.textContent='已複製'}catch{status('複製失敗，請選取文字複製。',true)}};item.append(copy)}$('chat').append(item);return content}
function render(){$('chat').replaceChildren();if(!messages.length){const welcome=document.createElement('div');welcome.className='welcome';const title=document.createElement('h2');title.textContent='從一個新想法，開始討論。';welcome.append(title);for(const text of ['我想在 cross-filter 結構化剪枝上有創新突破，請提出三個值得探索的新方向。','除了 magnitude-based importance，還有哪些適合共享 mask 的剪枝準則？','我只有兩週時間，下一個最值得做的小實驗是什麼？']){const b=document.createElement('button');b.className='suggestion';b.textContent=text;b.onclick=()=>{$('question').value=text;$('question').focus()};welcome.append(b)}$('chat').append(welcome)}else for(const m of messages)bubble(m.role,m.content)}
function scroll(){$('chat').scrollTop=$('chat').scrollHeight}
$('reset').onclick=()=>{if(busy)return;if(messages.length&&!confirm('清除這個瀏覽器中的對話並重新開始？'))return;messages=[];persist();render();status('已開啟新對話。')};
$('export').onclick=()=>{const text=messages.map(m=>'## '+(m.role==='user'?'你':'Claude')+'\n\n'+m.content).join('\n\n');const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='CNN研究討論.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('question').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const question=$('question').value.trim(),key=$('key').value.trim();if(!question)return;if(!key){status('請先在左側輸入 MYAI168 API Key。',true);$('key').focus();return}busy=true;$('send').disabled=true;$('reset').disabled=true;const pending=[...messages,{role:'user',content:question}];$('chat').replaceChildren();for(const m of pending)bubble(m.role,m.content);const output=bubble('assistant','');scroll();let answer='',complete=false;const start=Date.now();status('正在連線…');const timer=setInterval(()=>{if(!answer)status('等待 Claude 思考中… '+Math.floor((Date.now()-start)/1000)+' 秒')},1000);
try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,messages:pending})});if(!response.ok){const data=await response.json();throw Error(data.error||'連線失敗')}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';while(true){const {value,done}=await reader.read();buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});let end;while((end=buffer.indexOf('\n'))>=0){const event=JSON.parse(buffer.slice(0,end));buffer=buffer.slice(end+1);if(event.error)throw Error(event.error);if(event.status)status(event.status);if(event.text){answer+=event.text;output.textContent=answer;status('Claude 正在回覆…');scroll()}if(event.done){complete=true;status('回覆完成 · 輸入 '+event.input_tokens+' / 輸出 '+event.output_tokens+' tokens'+(event.stop==='max_tokens'?' · 達到長度上限，可追問繼續。':''))}}if(done)break}if(!complete||!answer)throw Error('未收到完整文字回覆，請重試。');messages=[...pending,{role:'assistant',content:answer}];persist();$('question').value=''}catch(error){status(error.message+'（本輪未存入歷史，可再次傳送。）',true);if(!answer)output.textContent='本次未取得回覆。'}finally{clearInterval(timer);busy=false;$('send').disabled=false;$('reset').disabled=false;$('question').focus()}};
render();scroll();
</script></html>
